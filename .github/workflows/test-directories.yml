name: Diagnose ARM64 compiler results
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.2', arch: arm64, host: amd64_arm64, sdk: '10.0.22621.0'}
          - {php: '8.4', arch: arm64, host: arm64, sdk: '10.0.22621.0'}
          - {php: '8.2', arch: x64, host: x64, sdk: '10.0.22621.0'}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: fix/windows-arm64-8.2
          path: source
      - name: Get toolset
        id: toolset
        shell: pwsh
        run: |
          Import-Module ./php/BuildPhp -Force
          $vs = Get-VsVersion -PhpVersion '${{ matrix.php }}' -Arch '${{ matrix.arch }}'
          "version=$($vs.toolset)" >> $env:GITHUB_OUTPUT
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.host }}
          toolset: ${{ steps.toolset.outputs.version }}
          sdk: ${{ matrix.sdk }}
      - name: Compare compiler modes
        shell: pwsh
        run: |
          Get-Command cl,link | Format-List Source
          New-Item results -ItemType Directory | Out-Null
          $cases = @(
            @{name='optimized';flags=@('/O2')},
            @{name='unoptimized';flags=@('/Od')},
            @{name='unaligned';flags=@('/O2','/DUNALIGNED_SAFE')},
            @{name='no-contraction';flags=@('/O2','/DNO_CONTRACTION')}
          )
          foreach ($case in $cases) {
            $name = $case.name
            $flags = $case.flags
            & cl /nologo /MD @flags /Isource/ext/hash/murmur diagnostics/arm64-compiler.c source/ext/hash/murmur/PMurHash.c "/Feresults/$name.exe" /link /incremental:no
            if ($LASTEXITCODE) { throw "Compile failed: $name" }
            & "./results/$name.exe" | Tee-Object "results/$name.txt"
            if ($LASTEXITCODE) { throw "Execution failed: $name" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.php }}-${{ matrix.arch }}
          path: results
