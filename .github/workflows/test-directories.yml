name: Verify v142 ARM64 result fixes
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.2', arch: arm64, host: amd64_arm64, sdk: '10.0.22621.0'}
          - {php: '8.4', arch: arm64, host: arm64, sdk: '10.0.22621.0'}
          - {php: '8.2', arch: x64, host: x64, sdk: '10.0.22621.0'}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: fix/msvc-v142-arm64-results
          path: source
      - name: Get toolset
        id: toolset
        shell: pwsh
        run: |
          Import-Module ./php/BuildPhp -Force
          $vs = Get-VsVersion -PhpVersion '${{ matrix.php }}' -Arch '${{ matrix.arch }}'
          "version=$($vs.toolset)" >> $env:GITHUB_OUTPUT
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.host }}
          toolset: ${{ steps.toolset.outputs.version }}
          sdk: ${{ matrix.sdk }}
      - name: Compare compiler modes
        shell: pwsh
        run: |
          Get-Command cl,link | Format-List Source
          New-Item results -ItemType Directory | Out-Null
          $template = Get-Content source/win32/build/config.w32.h.in -Raw
          $pragma = [regex]::Match($template, '(?s)#if defined\(_MSC_VER\)[^\r\n]*\r?\n# pragma fp_contract\(off\)\r?\n#endif').Value
          if (-not $pragma) { throw 'Missing reviewed Windows ARM64 pragma' }
          $probe = [IO.File]::ReadAllText('diagnostics/arm64-compiler.c')
          [IO.File]::WriteAllText('diagnostics/arm64-compiler.c', "$pragma`n$probe")
          $cases = @(
            @{name='optimized';flags=@('/O2')},
            @{name='unoptimized';flags=@('/Od')},
            @{name='unaligned';flags=@('/O2','/DUNALIGNED_SAFE')},
            @{name='no-contraction';flags=@('/O2','/DNO_CONTRACTION')}
          )
          foreach ($case in $cases) {
            $name = $case.name
            $flags = $case.flags
            & cl /nologo /MD @flags /Isource/ext/hash/murmur diagnostics/arm64-compiler.c source/ext/hash/murmur/PMurHash.c "/Feresults/$name.exe" /link /incremental:no
            if ($LASTEXITCODE) { throw "Compile failed: $name" }
            $output = & "./results/$name.exe" | Tee-Object "results/$name.txt"
            if ($LASTEXITCODE) { throw "Execution failed: $name" }
            if ($output -notcontains 'murmur_cases=8580 murmur_failures=0' -or $output -notcontains 'range_count=7' -or $output -notcontains 'range[3]=0') { throw "Incorrect output: $name" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.php }}-${{ matrix.arch }}
          path: results
  unix:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: fix/msvc-v142-arm64-results
          path: patched
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: fix/windows-arm64-8.2
          path: original
      - name: Compare original and patched ARM64 GCC and Clang results
        shell: bash
        run: |
          for compiler in gcc clang; do
            for version in original patched; do
              "$compiler" -O2 -ffp-contract=off -I"$version/ext/hash/murmur" diagnostics/arm64-compiler.c "$version/ext/hash/murmur/PMurHash.c" -o probe
              ./probe > "$compiler-$version.txt"
            done
            diff -u "$compiler-original.txt" "$compiler-patched.txt"
            cat "$compiler-patched.txt"
            grep -Fx 'murmur_cases=8580 murmur_failures=0' "$compiler-patched.txt"
            grep -Fx 'range_count=7' "$compiler-patched.txt"
          done
