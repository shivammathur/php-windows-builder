name: Capture CGI child exits on original ARM64 and published x64
on: workflow_dispatch
jobs:
  cgi:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: original-arm64, extra: '', source: fix/windows-arm64-8.6}
          - {name: published-x64, extra: '-PublishedX64', source: fix/windows-arm64-8.4}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: ${{ matrix.source }}
          path: source
      - uses: actions/download-artifact@v8
        if: matrix.name == 'original-arm64'
        with:
          name: artifacts
          run-id: 38476128354
          github-token: ${{ github.token }}
          path: artifacts
      - name: Capture child exit status through the same popen path
        shell: pwsh
        run: ./diagnostics/cgi-repeat.ps1 -Php '8.6' -Ts ts ${{ matrix.extra }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cgi-exits-${{ matrix.name }}
          path: results
