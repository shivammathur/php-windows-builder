name: Diagnose ARM64 generator bailout and CGI runtime failures
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6', master]
        ts: [nts, ts]
    steps:
      - uses: actions/checkout@v6
      - name: Select the original package and source branch
        id: plan
        shell: pwsh
        run: |
          $p = @(Get-Content diagnostics/core-runtime-plan.json -Raw | ConvertFrom-Json | Where-Object { $_.php -eq '${{ matrix.php }}' -and $_.ts -eq '${{ matrix.ts }}' })
          if ($p.Count -ne 1) { throw 'Ambiguous package provenance' }
          foreach ($key in 'source','run') { "$key=$($p[0].$key)" >> $env:GITHUB_OUTPUT }
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: ${{ steps.plan.outputs.source }}
          path: source
      - uses: actions/download-artifact@v8
        with:
          name: artifacts
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Inspect unchanged packages and collect native exception stacks
        shell: pwsh
        run: ./diagnostics/core-runtime.ps1 -Php '${{ matrix.php }}' -Ts '${{ matrix.ts }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-runtime-${{ matrix.php }}-${{ matrix.ts }}
          path: results
