name: Complete reviewed runtime validation
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  firebird:
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: fix/windows-arm64-8.4
          path: source
      - uses: actions/download-artifact@v8
        if: matrix.arch == 'arm64'
        with:
          name: artifacts
          run-id: 38455898994
          github-token: ${{ github.token }}
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          repository: winlibs/winlib-builder
          name: fbclient-4.0.7-vs17-${{ matrix.arch }}
          run-id: 38406823804
          github-token: ${{ github.token }}
          path: fbdeps
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}
          toolset: '14.44'
      - name: Compare current and prior upstream BLOB behavior
        shell: pwsh
        run: ./diagnostics/firebird-source-control.ps1 -Arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firebird-source-${{ matrix.arch }}
          path: |
            firebird-*.log
            firebird-*.xml
            firebird-*.json
            firebird-*.diff
  extensions:
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        ts: [nts, ts]
        opcache: [nocache, opcache]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: test/arm64-series-dependencies
          path: builder
      - name: Resolve original package and exact dependency cache
        id: plan
        shell: pwsh
        run: |
          if ((git -C builder rev-parse HEAD) -ne '1d4e815ca5467192388eb2c89d1227522cf1e3d5') { throw 'Production test builder moved' }
          $p = Get-Content diagnostics/php-runs.json -Raw | ConvertFrom-Json | Where-Object php -eq '${{ matrix.php }}'
          foreach ($key in 'version','source','run','dependencies') { "$key=$($p.$key)" >> $env:GITHUB_OUTPUT }
          Import-Module ./builder/php/BuildPhp -Force
          $info = Get-DepsCacheInfo -PhpVersion $p.version -Arch arm64 -LibsBuildRuns $p.dependencies -IncludeDefaultRunsKey
          Set-Content packages.txt ($info.Packages -join "`n")
          "cache-key=$($info.CacheKey)" >> $env:GITHUB_OUTPUT
          "cache-dir=$($info.CacheDir)" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v8
        with:
          name: artifacts
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: ${{ steps.plan.outputs.cache-dir }}
          key: ${{ steps.plan.outputs.cache-key }}-${{ hashFiles('packages.txt') }}
          fail-on-cache-miss: true
      - name: Test complete extension suite with original binary packages
        shell: pwsh
        env:
          DEPS_DIR: ${{ steps.plan.outputs.cache-dir }}
          DEPS_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          LIBS_BUILD_RUNS: ${{ steps.plan.outputs.dependencies }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Import-Module ./builder/php/BuildPhp -Force
          Invoke-PhpTests -PhpVersion '${{ steps.plan.outputs.version }}' -Arch arm64 -Ts '${{ matrix.ts }}' -Opcache '${{ matrix.opcache }}' -TestType ext -SourceRepository shivammathur/php-src -SourceRef '${{ steps.plan.outputs.source }}' -FailOnError
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reviewed-ext-${{ matrix.php }}-${{ matrix.ts }}-${{ matrix.opcache }}
          path: |
            test-arm64-${{ matrix.ts }}-${{ matrix.opcache }}-ext.xml
            test-arm64-${{ matrix.ts }}-${{ matrix.opcache }}-ext.log
