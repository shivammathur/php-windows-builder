name: Review remaining ARM64 test failures against controls
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  controls:
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.2', arch: x64, case: files}
          - {php: '8.2', arch: arm64, case: files}
          - {php: '8.4', arch: x64, case: firebird4}
          - {php: '8.4', arch: x64, case: firebird6}
          - {php: '8.3', arch: x64, case: postgres}
          - {php: '8.3', arch: arm64, case: postgres}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve original build
        id: plan
        shell: pwsh
        run: |
          $p = Get-Content diagnostics/php-runs.json -Raw | ConvertFrom-Json | Where-Object php -eq '${{ matrix.php }}'
          "run=$($p.run)" >> $env:GITHUB_OUTPUT
          "source=$($p.source)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: ${{ steps.plan.outputs.source }}
          path: source
      - uses: actions/download-artifact@v8
        if: matrix.arch == 'arm64'
        with:
          name: artifacts
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Compare runtime and runner behavior
        shell: pwsh
        run: ./diagnostics/runtime-controls.ps1 -Php '${{ matrix.php }}' -Arch '${{ matrix.arch }}' -Case '${{ matrix.case }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: control-${{ matrix.php }}-${{ matrix.arch }}-${{ matrix.case }}
          path: |
            control*.json
            control.xml
            control.log
            priority.log
            client.log
            pgsql-*.log
            postgres-*.log
            postgres-*.json
