name: Compare original and corrected core using the production test harness
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [original, no-shrink-wrap]
        cache: [nocache, opcache]
    env:
      DEPS_DIR: C:\deps-8.6-arm64
      DEPS_CACHE_HIT: 'true'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve source line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: test/arm64-series-dependencies
          path: builder
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: fix/windows-arm64-8.6
          path: source
      - uses: actions/cache/restore@v5
        with:
          path: C:\deps-8.6-arm64
          key: deps-8.6-arm64-850eaaf43fd92eff-0a308cab04b4723b6d360aab9e3e4a38f0006e95d8696d1b5f9e71cbf88827b3
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8
        with:
          name: artifacts
          run-id: 38476128354
          github-token: ${{ github.token }}
          path: artifacts
      - uses: actions/download-artifact@v8
        if: matrix.mode == 'no-shrink-wrap'
        with:
          name: core-link-no-shrink-wrap
          run-id: 38484957711
          github-token: ${{ github.token }}
          path: relink
      - name: Run complete core tests with unchanged production settings
        shell: pwsh
        run: ./diagnostics/core-runtime-reviewed.ps1 -Mode '${{ matrix.mode }}' -Cache '${{ matrix.cache }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reviewed-core-${{ matrix.mode }}-${{ matrix.cache }}
          path: results
