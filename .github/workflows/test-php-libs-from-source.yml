name: Build PHP with custom library builds from winlibs/winlib-builder (source)
run-name: ARM64 toolset ${{ inputs.toolset }} — ${{ inputs.php-src-ref }}
on:
  workflow_dispatch:
    inputs:
      php-src-repository:
        description: 'php-src repository to source builds and tests from'
        required: true
      php-src-ref:
        description: 'Branch in the php-src fork to source builds and tests from'
        required: true
      toolset:
        type: choice
        options: ['14.50', '14.52']
        description: Native ARM64 compiler toolset to compare
        required: true
      libs-build-runs:
        description: 'Comma-separated list of GitHub Actions run IDs from winlibs/winlib-builder'
        required: false
      sbom:
        type: choice
        options: ['true', 'false']
        description: Add SBOM files to binary archives
        required: false
        default: 'true'

jobs:
  resolve-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout PHP source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: php-src
          fetch-depth: 1
          sparse-checkout: main/php_version.h
          sparse-checkout-cone-mode: false

      - name: Resolve runner
        id: resolve
        shell: bash
        run: |
          read -r major minor < <(awk '/^#define PHP_(MAJOR|MINOR)_VERSION/ { v[++i]=$3 } END { print v[1], v[2] }' php-src/main/php_version.h)
          runner="$([ "$major" -gt 8 ] || { [ "$major" -eq 8 ] && [ "$minor" -ge 6 ]; } && echo windows-11-vs2026-arm || echo windows-11-arm)"
          echo "PHP source version: $major.$minor; runner: $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "version=$(awk '/^#define PHP_VERSION / { gsub(/"/, "", $3); print $3 }' php-src/main/php_version.h)" >> "$GITHUB_OUTPUT"

  deps:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    outputs:
      cache-dir: ${{ steps.cache-key.outputs.cache-dir }}
      cache-key: ${{ steps.restore.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v6

      - name: Get dependency cache key
        id: cache-key
        shell: pwsh
        run: |
          Import-Module ./php/BuildPhp -Force
          $info = Get-DepsCacheInfo -PhpVersion '${{ needs.resolve-runner.outputs.version }}' -Arch arm64 -LibsBuildRuns '${{ inputs.libs-build-runs }}' -IncludeDefaultRunsKey
          Set-Content packages.txt ($info.Packages -join "`n")
          Add-Content $env:GITHUB_OUTPUT "cache-key=$($info.CacheKey)"
          Add-Content $env:GITHUB_OUTPUT "cache-dir=$($info.CacheDir)"
          Add-Content $env:GITHUB_OUTPUT "vs=$($info.VsVersion)"

      - name: Restore dependency cache
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache-key.outputs.cache-dir }}
          key: ${{ steps.cache-key.outputs.cache-key }}-${{ hashFiles('packages.txt') }}

      - name: Download dependencies
        if: steps.restore.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          LIBS_BUILD_RUNS: ${{ inputs.libs-build-runs }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rate = Invoke-RestMethod https://api.github.com/rate_limit -Headers @{Authorization="Bearer $env:GITHUB_TOKEN"}
          $required = 12 * @('${{ inputs.libs-build-runs }}' -split ',' | Where-Object { $_ }).Count
          if ($rate.resources.core.remaining -lt $required) {
            $reset = [DateTimeOffset]::FromUnixTimeSeconds($rate.resources.core.reset)
            $wait = [Math]::Max(1, [int][Math]::Ceiling(($reset - [DateTimeOffset]::UtcNow).TotalSeconds) + 5)
            Write-Host "Waiting $wait seconds for the GitHub API quota to reset before parallel dependency downloads."
            Start-Sleep -Seconds $wait
          }
          Import-Module ./php/BuildPhp -Force
          & (Get-Module BuildPhp) {
            Add-PhpDeps -PhpVersion '${{ needs.resolve-runner.outputs.version }}' -VsVersion '${{ steps.cache-key.outputs.vs }}' -Arch arm64 -Destination '${{ steps.cache-key.outputs.cache-dir }}'
          }

      - name: Save dependency cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.cache-key.outputs.cache-dir }}
          key: ${{ steps.restore.outputs.cache-primary-key }}

  php:
    needs: [resolve-runner, deps]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
        ts: [nts, ts]
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    steps:
      - name: Configure PHP source line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout PHP source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: builder

      - name: Restore dependency cache
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: ${{ needs.deps.outputs.cache-dir }}
          key: ${{ needs.deps.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Install and select comparison toolset
        shell: pwsh
        env:
          REQUESTED_TOOLSET: ${{ inputs.toolset }}
        run: |
          ./builder/diagnostics/Install-Toolset.ps1 -Toolset $env:REQUESTED_TOOLSET
          $workaround = Select-String -Path ext/gd/libgd/gdft.c,win32/build/confutils.js -Pattern '_MSC_VER == 1951|shrink-wrapping-'
          if ($workaround) { throw 'The test source still contains a 19.51 workaround' }
          git rev-parse HEAD | Set-Content toolset-evidence/source-sha.txt
          git -C builder rev-parse HEAD | Set-Content toolset-evidence/builder-sha.txt

      - name: Build
        id: build
        uses: ./builder/php
        with:
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          libs-build-runs: ${{ inputs.libs-build-runs }}
          sbom: ${{ inputs.sbom }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PHP_BUILD_PROVIDER: "The PHP Group"
          DEPS_DIR: ${{ needs.deps.outputs.cache-dir }}
          DEPS_CACHE_HIT: ${{ steps.deps.outputs.cache-hit }}

      - name: Preserve build evidence
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          ./builder/diagnostics/Collect-ToolsetEvidence.ps1

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: toolset-evidence-${{ matrix.ts }}
          path: toolset-evidence/
          if-no-files-found: error

  artifacts:
    runs-on: ubuntu-latest
    needs: php
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - name: Upload artifacts
        uses: actions/upload-artifact/merge@v7
        id: artifacts
        with:
          name: artifacts
          pattern: artifacts-*
          delete-merged: true

  tests:
    needs: [resolve-runner, artifacts]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
        ts: [nts, ts]
        opcache: [opcache, nocache]
        test-type: [php, ext]
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        id: artifacts
        with:
          name: artifacts

      - name: Get Cache Key
        id: cache-key
        shell: pwsh
        run: |
          $artifactDirectory = $(pwd).Path
          $zip = Get-ChildItem -Path $artifactDirectory -Filter "php-*.zip" -File |
            Where-Object { $_.Name -match "^php-(.+?)-(?:nts-)?Win32-v[sc]\d+-${{ matrix.arch }}\.zip$" } |
            Select-Object -First 1
          if ($null -eq $zip) {
            throw "Unable to determine PHP version from build artifacts in $artifactDirectory"
          }
          $phpVersion = [regex]::Match($zip.Name, '^php-(.+?)-(?:nts-)?Win32-v[sc]\d+-').Groups[1].Value

          Import-Module (Join-Path $(pwd).Path '\php\BuildPhp') -Force
          $cacheInfo = Get-DepsCacheInfo -PhpVersion $phpVersion -Arch '${{ matrix.arch }}' -LibsBuildRuns '${{ inputs.libs-build-runs }}' -IncludeDefaultRunsKey
          Set-Content -Path packages.txt -Value ($cacheInfo.Packages -join "`n")
          Add-Content -Value "php-version=$phpVersion" -Path $env:GITHUB_OUTPUT
          Add-Content -Value "cache-key=$($cacheInfo.CacheKey)" -Path $env:GITHUB_OUTPUT
          Add-Content -Value "cache-dir=$($cacheInfo.CacheDir)" -Path $env:GITHUB_OUTPUT

      - name: Cache Deps
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: ${{ steps.cache-key.outputs.cache-dir }}
          key: ${{ steps.cache-key.outputs.cache-key }}-${{ hashFiles('packages.txt') }}
          fail-on-cache-miss: true

      - name: Test PHP
        shell: pwsh
        env:
          DEPS_DIR: ${{ steps.cache-key.outputs.cache-dir }}
          DEPS_CACHE_HIT: ${{ steps.cache-deps.outputs.cache-hit }}
          LIBS_BUILD_RUNS: ${{ inputs.libs-build-runs }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Import-Module (Join-Path $(pwd).Path '\php\BuildPhp') -Force
          Invoke-PhpTests -PhpVersion ${{ steps.cache-key.outputs.php-version }} `
                          -Arch ${{matrix.arch}} `
                          -Ts ${{matrix.ts}} `
                          -Opcache ${{matrix.opcache}} `
                          -TestType ${{matrix.test-type}} `
                          -SourceRepository '${{ inputs.php-src-repository }}' `
                          -SourceRef '${{ inputs.php-src-ref }}' `
                          -FailOnError

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{matrix.arch}}-${{matrix.ts}}-${{matrix.opcache}}-${{matrix.test-type}}
          path: |
            test-${{matrix.arch}}-${{matrix.ts}}-${{matrix.opcache}}-${{matrix.test-type}}.xml
            test-${{matrix.arch}}-${{matrix.ts}}-${{matrix.opcache}}-${{matrix.test-type}}.log
          if-no-files-found: error

  smoke-tests:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
        ts: [nts, ts]
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    needs: [resolve-runner, artifacts]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts
          path: artifacts

      - name: Smoke test PHP builds
        shell: pwsh
        run: |
          Import-Module (Join-Path $(pwd).Path '\php\BuildPhp') -Force
          Invoke-PhpSmokeTests -ArtifactsDirectory (Join-Path $(pwd).Path 'artifacts') `
                               -Arch ${{matrix.arch}} `
                               -Ts ${{matrix.ts}}
