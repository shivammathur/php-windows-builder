name: Clang PR 33 validation
run-name: Clang vs MSVC - ${{ inputs.php-src-ref }}
on:
  workflow_dispatch:
    inputs:
      php-src-repository:
        description: PHP source repository
        required: true
        default: shivammathur/php-src
      php-src-ref:
        description: Identical PHP source for both compilers
        required: true
        default: 15ca4fb6c34196b58bfe723d305883ea984e18cc
      build-run:
        description: Reuse the eight build artifacts from a completed validation run
        required: false
      run-regressions:
        description: Run the full differential PHP test suites
        type: boolean
        default: true
      libs-build-runs:
        description: Optional dependency builds
        required: false
      sbom:
        type: choice
        options: ['true', 'false']
        default: 'true'
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: ${{ inputs.build-run == '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        ts: [nts, ts]
        variant: [msvc, clang]
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
      - shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}
          path: source
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.variant == 'msvc' && '44b177dd05168995a788123c8807a70e2d0db20c' || github.sha }}
          path: builder
      - name: Build and capture diagnostics
        shell: pwsh
        env:
          SBOM: ${{ inputs.sbom }}
          LIBS_BUILD_RUNS: ${{ inputs.libs-build-runs }}
          GITHUB_TOKEN: ${{ github.token }}
          PHP_BUILD_PROVIDER: The PHP Group
        run: ./harness/.github/scripts/clang-comparison/build.ps1 -Variant '${{ matrix.variant }}' -Arch '${{ matrix.arch }}' -Ts '${{ matrix.ts }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-${{ matrix.variant }}-${{ matrix.arch }}-${{ matrix.ts }}
          path: results/
          retention-days: 14
  compare:
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.build-run != '') }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        ts: [nts, ts]
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}
          path: source
      - uses: actions/download-artifact@v8
        with:
          name: build-msvc-${{ matrix.arch }}-${{ matrix.ts }}
          path: input/msvc
          run-id: ${{ inputs.build-run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: build-clang-${{ matrix.arch }}-${{ matrix.ts }}
          path: input/clang
          run-id: ${{ inputs.build-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Compare archives and benchmark on the same machine
        shell: pwsh
        run: ./.github/scripts/clang-comparison/compare.ps1 -Arch '${{ matrix.arch }}' -Ts '${{ matrix.ts }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: comparison-${{ matrix.arch }}-${{ matrix.ts }}
          path: comparison/
  regressions:
    if: ${{ !cancelled() && inputs.run-regressions && (needs.build.result == 'success' || inputs.build-run != '') }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        ts: [nts, ts]
        mode: [nocache, jit]
    runs-on: windows-2025-vs2026
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}
          path: source
      - uses: actions/download-artifact@v8
        with:
          name: build-msvc-${{ matrix.arch }}-${{ matrix.ts }}
          path: input/msvc
          run-id: ${{ inputs.build-run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: build-clang-${{ matrix.arch }}-${{ matrix.ts }}
          path: input/clang
          run-id: ${{ inputs.build-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Run identical PHP test suites for both compilers
        shell: pwsh
        run: ./.github/scripts/clang-comparison/regressions.ps1 -Mode '${{ matrix.mode }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regressions-${{ matrix.arch }}-${{ matrix.ts }}-${{ matrix.mode }}
          path: regressions/
