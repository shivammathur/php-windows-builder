name: Test ARM64 PHP database prerequisites
on:
  workflow_dispatch:
jobs:
  services:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-arm, windows-11-vs2026-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Test database prerequisites
        shell: pwsh
        run: |
          Import-Module ./php/BuildPhp/BuildPhp.psd1 -Force
          & (Get-Module BuildPhp) {
            Set-PhpExtTestEnvironment -BuildDirectory $pwd -TestsDirectory . -Arch arm64 `
              -TestDirectories @('ext\mysqli\tests', 'ext\pgsql\tests', 'ext\odbc\tests', 'ext\pdo_firebird\tests')
            & "$env:PGBIN\psql.exe" -h 127.0.0.1 -U postgres -d test -c 'SELECT version();'
            if ($LASTEXITCODE) { throw 'PostgreSQL test server query failed' }
            & mysql --host=127.0.0.1 --user=root -e 'SELECT VERSION();' test
            if ($LASTEXITCODE) { throw 'MySQL test server query failed' }
            if ((Get-Service FirebirdServerPHPTestFirebirdx64).Status -ne 'Running') { throw 'Firebird test service failed' }
            Set-Content "$env:TEMP\firebird-query.sql" 'SELECT 1 FROM RDB$DATABASE;'
            & C:\Firebird-x64\isql.exe -q -user SYSDBA -password phpfi "127.0.0.1:$env:PDO_FIREBIRD_TEST_DATABASE" -i "$env:TEMP\firebird-query.sql"
            if ($LASTEXITCODE) { throw 'Firebird test server query failed' }
            if ($env:ODBC_TEST_DSN -or $env:PDO_ODBC_TEST_DSN) { throw 'Unsupported SQL Server tests were configured' }
          }
