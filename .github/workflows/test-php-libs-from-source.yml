name: Relink the preserved ARM64 PGO compiler failure
run-name: Validate the scoped GD PGO workaround with real objects and profiles
on:
  workflow_dispatch:
    inputs:
      php-src-repository:
        description: 'php-src repository to source builds and tests from'
        required: true
      php-src-ref:
        description: 'Branch, tag, or SHA in the php-src repository to source builds and tests from'
        required: true
      libs-build-runs:
        description: 'Comma-separated list of GitHub Actions run IDs from winlibs/winlib-builder'
        required: false
      sbom:
        type: choice
        options: ['true', 'false']
        description: Add SBOM files to binary archives
        required: false
        default: 'true'

jobs:
  resolve-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout PHP source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: php-src
          fetch-depth: 1
          sparse-checkout: main/php_version.h
          sparse-checkout-cone-mode: false

      - name: Resolve runner
        id: resolve
        shell: bash
        run: |
          read -r major minor < <(awk '/^#define PHP_(MAJOR|MINOR)_VERSION/ { v[++i]=$3 } END { print v[1], v[2] }' php-src/main/php_version.h)
          runner="$([ "$major" -gt 8 ] || { [ "$major" -eq 8 ] && [ "$minor" -ge 6 ]; } && echo windows-11-vs2026-arm || echo windows-11-arm)"
          echo "PHP source version: $major.$minor; runner: $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "version=$(awk '/^#define PHP_VERSION / { gsub(/"/, "", $3); print $3 }' php-src/main/php_version.h)" >> "$GITHUB_OUTPUT"

  deps:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    outputs:
      cache-dir: ${{ steps.cache-key.outputs.cache-dir }}
      cache-key: ${{ steps.restore.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/arm64-series-dependencies

      - name: Get dependency cache key
        id: cache-key
        shell: pwsh
        run: |
          Import-Module ./php/BuildPhp -Force
          $info = Get-DepsCacheInfo -PhpVersion '${{ needs.resolve-runner.outputs.version }}' -Arch arm64 -LibsBuildRuns '${{ inputs.libs-build-runs }}' -IncludeDefaultRunsKey
          Set-Content packages.txt ($info.Packages -join "`n")
          Add-Content $env:GITHUB_OUTPUT "cache-key=$($info.CacheKey)"
          Add-Content $env:GITHUB_OUTPUT "cache-dir=$($info.CacheDir)"
          Add-Content $env:GITHUB_OUTPUT "vs=$($info.VsVersion)"

      - name: Restore dependency cache
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache-key.outputs.cache-dir }}
          key: ${{ steps.cache-key.outputs.cache-key }}-${{ hashFiles('packages.txt') }}

      - name: Download dependencies
        if: steps.restore.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          LIBS_BUILD_RUNS: ${{ inputs.libs-build-runs }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rate = Invoke-RestMethod https://api.github.com/rate_limit -Headers @{Authorization="Bearer $env:GITHUB_TOKEN"}
          $required = 12 * @('${{ inputs.libs-build-runs }}' -split ',' | Where-Object { $_ }).Count
          if ($rate.resources.core.remaining -lt $required) {
            $reset = [DateTimeOffset]::FromUnixTimeSeconds($rate.resources.core.reset)
            $wait = [Math]::Max(1, [int][Math]::Ceiling(($reset - [DateTimeOffset]::UtcNow).TotalSeconds) + 5)
            Write-Host "Waiting $wait seconds for the GitHub API quota to reset before parallel dependency downloads."
            Start-Sleep -Seconds $wait
          }
          Import-Module ./php/BuildPhp -Force
          & (Get-Module BuildPhp) {
            Add-PhpDeps -PhpVersion '${{ needs.resolve-runner.outputs.version }}' -VsVersion '${{ steps.cache-key.outputs.vs }}' -Arch arm64 -Destination '${{ steps.cache-key.outputs.cache-dir }}'
          }

      - name: Save dependency cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.cache-key.outputs.cache-dir }}
          key: ${{ steps.restore.outputs.cache-primary-key }}

  relink:
    needs: [resolve-runner, deps]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: cold-profile, host: arm64}
          - {name: trained-profile, host: arm64}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}

      - uses: actions/checkout@v6
        with:
          path: probe

      - uses: actions/cache/restore@v5
        with:
          path: ${{ needs.deps.outputs.cache-dir }}
          key: ${{ needs.deps.outputs.cache-key }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v8
        with:
          repository: shivammathur/php-windows-builder
          run-id: 38458709293
          name: pgo-state-baseline-ts
          path: preserved
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.host }}
          toolset: 14.51.36231

      - name: Restore identical objects, profile and libraries
        shell: pwsh
        run: |
          & 7z x preserved/build-state.7z -oreplay -y
          if ($LASTEXITCODE) { throw 'Cannot restore the preserved compiler state' }
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          if ($parent -ne [IO.Path]::GetFullPath('C:/a/php-windows-builder')) { throw "Replay paths differ: $parent" }
          Move-Item replay/obj "$parent/obj"
          Copy-Item '${{ needs.deps.outputs.cache-dir }}' "$parent/deps" -Recurse
          $pgd = "$parent/obj/Release_TS/php_gd.pgd"
          $hash = (Get-FileHash $pgd).Hash
          if ($hash -ne '979C6FE775BF4B9B2F5C514A917D9273E17B9C412A98D515D26215ACE504924F') { throw 'Profile changed' }
          Write-Host "Preserved PHP PGO profile SHA256: $hash"
          Get-ChildItem "$parent/obj/Release_TS" -Filter *.obj -Recurse |
            Sort-Object FullName | Get-FileHash | ConvertTo-Json -Depth 4 | Set-Content object-hashes.json
          Write-Host "Object manifest SHA256: $((Get-FileHash object-hashes.json).Hash)"

      - name: Build the missing CLI for runtime checks
        shell: pwsh
        run: |
          Copy-Item replay/Makefile,replay/Makefile.objects .
          Copy-Item replay/main/config.w32.h main/config.w32.h
          if ((git rev-parse HEAD) -ne 'c8a2f56964243694ce4705a3500ef4cff86a7102') { throw 'PHP source branch changed' }
          $dateConfig = [IO.File]::ReadAllText('ext/date/config.w32')
          $lines = [regex]::Matches($dateConfig, 'tl_config\.WriteLine\(("(?:\\.|[^"\\])*")\);') | ForEach-Object { $_.Groups[1].Value | ConvertFrom-Json }
          if ($lines.Count -ne 10) { throw 'Unexpected timelib header generator' }
          Set-Content ext/date/lib/timelib_config.h $lines
          $out = 'C:/a/php-windows-builder/obj/Release_TS'
          $preservedFiles = @(Get-ChildItem $out -Recurse -Filter '*.obj') + @(Get-Item "$out/php8ts.dll", "$out/php8ts.lib", "$out/php_gd.pgd")
          $before = $preservedFiles | Sort-Object FullName | Get-FileHash | ConvertTo-Json
          # Build only the six CLI objects and resources. The normal target traverses
          # the core library's dependency graph and regenerates omitted parsers.
          $makefile = [IO.File]::ReadAllText('Makefile')
          $target = '$(BUILD_DIR)\php.exe: $(DEPS_CLI) $(CLI_GLOBAL_OBJS) $(BUILD_DIR)\$(PHPLIB) $(BUILD_DIR)\php.exe.res $(BUILD_DIR)\php.exe.manifest'
          if ([regex]::Matches($makefile, [regex]::Escape($target)).Count -ne 1) { throw 'Unexpected CLI target' }
          $makefile = $makefile.Replace($target, '$(BUILD_DIR)\php.exe: $(CLI_GLOBAL_OBJS) $(BUILD_DIR)\php.exe.res $(BUILD_DIR)\php.exe.manifest')
          $makefile = $makefile.Replace('LDFLAGS_CLI=/LTCG /USEPROFILE', 'LDFLAGS_CLI=/LTCG')
          $makefile = $makefile.Replace('/PGD:$(PGOPGD_DIR)\php.pgd $(LDFLAGS_CLI)', '$(LDFLAGS_CLI)')
          [IO.File]::WriteAllText('Makefile', $makefile)
          foreach ($file in 'main/config.w32.h','ext/date/lib/timelib_config.h','win32/build/php.ico','win32/build/default.manifest',"$out/resp/CLI_GLOBAL_OBJS.txt",'../deps/lib/edit_a.lib') {
            if (-not (Test-Path $file)) { throw "Missing CLI prerequisite: $file" }
          }
          & nmake /nologo php.exe 2>&1 | Tee-Object cli-build.log
          if ($LASTEXITCODE) { throw 'Cannot build CLI runtime harness' }
          $after = $preservedFiles | Sort-Object FullName | Get-FileHash | ConvertTo-Json
          if ($before -cne $after) { throw 'Preserved objects, core or GD profile changed while building CLI' }
          $env:PATH = "$env:VCToolsInstallDir/bin/arm64;C:/a/php-windows-builder/deps/bin;$out;$env:PATH"
          & "$out/php.exe" -n -r 'if (PHP_VERSION !== "8.6.0-dev" || PHP_INT_SIZE !== 8 || array_sum(range(1,10000)) !== 50005000) exit(1); echo "CLI baseline passed\n";'
          if ($LASTEXITCODE) { throw 'CLI baseline failed before GD experiment' }

      - name: Recompile only gdft with the reviewed MSVC workaround
        shell: pwsh
        run: |
          $out = 'C:/a/php-windows-builder/obj/Release_TS'
          $gdft = "$out/ext/gd/libgd/gdft.obj"
          $preserved = @(Get-ChildItem $out -Recurse -Filter '*.obj' | Where-Object FullName -ne ([IO.Path]::GetFullPath($gdft))) + @(Get-Item "$out/php8ts.dll","$out/php8ts.lib","$out/php_gd.pgd")
          $before = $preserved | Sort-Object FullName | Get-FileHash | ConvertTo-Json
          $path = Join-Path $env:GITHUB_WORKSPACE 'ext/gd/libgd/gdft.c'
          [IO.File]::WriteAllText($path, [IO.File]::ReadAllText($path).Replace("`r`n", "`n"))
          $patch = Join-Path $env:GITHUB_WORKSPACE 'probe/diagnostics/gd-arm64-pgo.patch'
          [IO.File]::WriteAllText($patch, [IO.File]::ReadAllText($patch).Replace("`r`n", "`n"))
          & git apply --check probe/diagnostics/gd-arm64-pgo.patch
          if ($LASTEXITCODE) { throw 'Workaround does not match reviewed source' }
          & git apply probe/diagnostics/gd-arm64-pgo.patch
          if ($LASTEXITCODE) { throw 'Cannot apply workaround' }
          git diff -- ext/gd/libgd/gdft.c | Tee-Object source-workaround.diff
          Add-Content Makefile ("gd-workaround-object:`n`t" + '$(CC) $(CFLAGS_GD_OBJ) $(CFLAGS) /Fo$(BUILD_DIR)\ext\gd\libgd\gdft.obj $(CFLAGS_BD_EXT_GD_LIBGD) /c ext\gd\libgd\gdft.c')
          Remove-Item $gdft
          & nmake /nologo gd-workaround-object 2>&1 | Tee-Object gdft-build.log
          if ($LASTEXITCODE) { throw 'Cannot compile the patched GD object' }
          $after = $preserved | Sort-Object FullName | Get-FileHash | ConvertTo-Json
          if ($before -cne $after) { throw 'Unrelated objects, core or original profile changed' }
          Get-FileHash $gdft | ConvertTo-Json | Set-Content patched-object.json

      - name: Select controlled profile input
        shell: pwsh
        env:
          VARIANT: ${{ matrix.name }}
        run: |
          $out = 'C:/a/php-windows-builder/obj/Release_TS'
          $pgd = "$out/php_gd.pgd"
          $runtime = Join-Path $env:VCToolsInstallDir 'bin/arm64'
          $env:PATH = "$runtime;C:/a/php-windows-builder/deps/bin;$out;$env:PATH"
          "PATH=$env:PATH" >> $env:GITHUB_ENV
          & pgomgr /summary $pgd | Tee-Object original-profile.txt
          if ($LASTEXITCODE) { throw 'Cannot read preserved profile' }
          $path = 'probe/pgo-relink.bat'
          $text = [IO.File]::ReadAllText($path)
          if ($env:VARIANT -eq 'no-profile-control') {
            $text = $text.Replace(' /USEPROFILE', '') -replace '/PGD:[^ ]+ ', ''
            if ($text -match '/PGD:|/USEPROFILE|/GENPROFILE') { throw 'Control still uses profile' }
            [IO.File]::WriteAllText($path, $text)
          } elseif ($env:VARIANT -in 'cold-profile','trained-profile') {
            Remove-Item $pgd
            Get-ChildItem $out -Filter 'php_gd!*.pgc' | Remove-Item
            [IO.File]::WriteAllText('probe/pgo-instrument.bat', $text.Replace('/USEPROFILE','/GENPROFILE'))
            & cmd /c (Join-Path $env:GITHUB_WORKSPACE 'probe/pgo-instrument.bat') 2>&1 | Tee-Object instrument.log
            if ($LASTEXITCODE) { throw 'Fresh instrumentation failed' }
            if ($env:VARIANT -eq 'cold-profile') {
              & "$out/php.exe" -n -d "extension=$out/php_gd.dll" -r 'if (!extension_loaded("gd")) exit(1); echo "GD startup-only profile\n";' 2>&1 | Tee-Object training.log
            } else {
              & "$out/php.exe" -n -d "extension=$out/php_gd.dll" -r 'for($i=0;$i<1000;$i++){$im=imagecreatetruecolor(100,100);$c=imagecolorallocate($im,255,255,255);if (!is_array(imagettftext($im,12,0,10,50,$c,"C:/Windows/Fonts/arial.ttf","hello &#197; &#x6C34;")) || !imagepng($im,"NUL")) exit(1);imagedestroy($im);}echo "GD training complete\n";' 2>&1 | Tee-Object training.log
            }
            if ($LASTEXITCODE) { throw 'GD training failed' }
            if (-not @(Get-ChildItem $out -Filter 'php_gd!*.pgc').Count) { throw 'No GD counters collected' }
            & pgomgr /merge:1000 $pgd | Tee-Object merge.log
            if ($LASTEXITCODE) { throw 'Merge failed' }
            & pgomgr /summary $pgd | Tee-Object fresh-profile.txt
            if ($LASTEXITCODE) { throw 'Cannot read new profile' }
            Get-ChildItem $out -Filter 'php_gd!*.pgc' | Remove-Item
          }
          Get-Content $path
          Get-Command link | Format-List Source
          (Get-Item (Get-Command link).Source).VersionInfo | Format-List FileVersion,ProductVersion

      - name: Force the original PGO link and check the resulting ARM64 binary
        shell: pwsh
        run: |
          & cmd /c (Join-Path $env:GITHUB_WORKSPACE 'probe/pgo-relink.bat') 2>&1 | Tee-Object relink.log
          $linkExit = $LASTEXITCODE
          if ($linkExit) { throw "Original PGO link failed: $linkExit" }
          $dll = 'C:/a/php-windows-builder/obj/Release_TS/php_gd.dll'
          & dumpbin /headers $dll | Tee-Object headers.log
          if ($LASTEXITCODE) { throw 'Invalid output DLL' }
          $bytes = [IO.File]::ReadAllBytes($dll)
          if ([BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes,60)+4) -ne 43620) { throw 'GD DLL is not ARM64' }
          & 'C:/a/php-windows-builder/obj/Release_TS/php.exe' -n -d "extension=$dll" -r 'echo PHP_VERSION, PHP_EOL; if (!extension_loaded("gd")) exit(1); $im=imagecreatetruecolor(10,10); $font="C:/Windows/Fonts/arial.ttf"; $actual=imagettfbbox(12,0,$font,"hello &#197; &#x6C34;"); if (imagesx($im)!==10 || !is_array($actual) || $actual!==imagettfbbox(12,0,$font,"hello \u{00C5} \u{6C34}")) exit(1); echo "GD runtime and numeric entities passed\n";'
          if ($LASTEXITCODE) { throw 'Relinked PHP cannot execute' }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gd-relink-${{ matrix.name }}
          path: |
            relink.log
            headers.log
            object-hashes.json
            original-profile.txt
            instrument.log
            training.log
            merge.log
            fresh-profile.txt
            cli-build.log
            gdft-build.log
            patched-object.json
            source-workaround.diff
