name: Reduce the confirmed VS18 ARM64 PGO reproducer
on:
  workflow_dispatch:
jobs:
  reduce:
    runs-on: windows-11-vs2026-arm
    strategy:
      fail-fast: false
      matrix:
        variant: [no-cache, no-vector, no-numeric, no-named, no-utf]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: shivammathur/php-src
          ref: fix/windows-arm64-8.6
          path: source
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
          toolset: '14.51'
      - name: Compare reduced program with its non-PGO control
        shell: pwsh
        run: ./diagnostics/gd-reduced.ps1 -Variant '${{ matrix.variant }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gd-reduce-${{ matrix.variant }}
          path: |
            reduced/*.c
            reduced/*.h
            reduced/*.log
            reduced/*.json
