name: Clang PR 33 validation
run-name: Clang vs MSVC - ${{ inputs.php-src-ref }}
on:
  workflow_dispatch:
    inputs:
      php-src-repository:
        description: PHP source repository
        required: true
        default: shivammathur/php-src
      php-src-ref:
        description: PHP source for builds and regression tests
        required: true
        default: 7f3ea98f6d6ff78672912601fa7198928ef900b2
      test-matrix:
        description: Optional regression matrix JSON for targeted reruns
        required: false
      test-files:
        description: Optional JSON array of PHPT paths for differential reruns
        required: false
      diagnose-runtime-run:
        description: Only debug retained runtimes (JSON array of run, artifact, label)
        required: false
      build-run:
        description: Reuse the eight build artifacts from a completed validation run
        required: false
      reuse-run:
        description: Reuse MSVC artifacts from this run; rebuild all Clang variants
        required: false
      reuse-source-ref:
        description: Explicit source SHA of reused MSVC builds before Clang compilation fixes
        required: false
      run-regressions:
        description: Run the full differential PHP test suites
        type: boolean
        default: true
      test-arch:
        description: Architectures to compare and test when reusing artifacts
        type: choice
        options: [both, x64, x86]
        default: both
permissions:
  contents: read
  actions: read
jobs:
  trace-cfg:
    if: ${{ inputs.diagnose-runtime-run != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.diagnose-runtime-run || '[{"run":"0","artifact":"unused","label":"unused"}]') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          architecture: ${{ startsWith(matrix.label, 'x86') && 'x86' || 'x64' }}
      - uses: actions/checkout@v6
        if: ${{ endsWith(matrix.label, '-manifest') }}
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}
          path: source
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: input
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
      - name: Trace the failure and check CFG causality
        shell: pwsh
        run: |
          if ('${{ matrix.label }}' -eq 'x64-profile') {
            ./.github/scripts/clang-comparison/probe-profile-modules.ps1
          } elseif ('${{ matrix.label }}'.EndsWith('-manifest')) {
            ./.github/scripts/clang-comparison/diagnose-manifest.ps1
          } else {
            ./.github/scripts/clang-comparison/diagnose-cfg.ps1 -Kind '${{ matrix.label }}'
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-analysis-${{ matrix.label }}
          path: diagnostics/
  build:
    if: ${{ inputs.build-run == '' && inputs.diagnose-runtime-run == '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        ts: [nts, ts]
        variant: ${{ fromJSON(inputs.reuse-run != '' && '["clang"]' || '["msvc", "clang"]') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
      - shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}
          path: source
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.variant == 'msvc' && '44b177dd05168995a788123c8807a70e2d0db20c' || github.sha }}
          path: builder
      - name: Build and capture diagnostics
        shell: pwsh
        env:
          SBOM: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          PHP_BUILD_PROVIDER: The PHP Group
        run: ./harness/.github/scripts/clang-comparison/build.ps1 -Variant '${{ matrix.variant }}' -Arch '${{ matrix.arch }}' -Ts '${{ matrix.ts }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-${{ matrix.variant }}-${{ matrix.arch }}-${{ matrix.ts }}
          path: results/
          retention-days: 14
  compare:
    if: ${{ !cancelled() && inputs.test-matrix == '' && (needs.build.result == 'success' || inputs.build-run != '') }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.test-arch == 'x64' && '["x64"]' || inputs.test-arch == 'x86' && '["x86"]' || '["x64", "x86"]') }}
        ts: [nts, ts]
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    env:
      REUSE_SOURCE_REF: ${{ inputs.reuse-source-ref }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}
          path: source
      - uses: actions/download-artifact@v8
        with:
          name: build-msvc-${{ matrix.arch }}-${{ matrix.ts }}
          path: input/msvc
          run-id: ${{ inputs.reuse-run || inputs.build-run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: build-clang-${{ matrix.arch }}-${{ matrix.ts }}
          path: input/clang
          run-id: ${{ inputs.build-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Compare archives and benchmark on the same machine
        shell: pwsh
        run: |
          python -m pip install pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { throw 'Could not install PE inspection dependency' }
          ./.github/scripts/clang-comparison/compare.ps1 -Arch '${{ matrix.arch }}' -Ts '${{ matrix.ts }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: comparison-${{ matrix.arch }}-${{ matrix.ts }}
          path: comparison/
  regressions:
    if: ${{ !cancelled() && inputs.run-regressions && (needs.build.result == 'success' || inputs.build-run != '') }}
    needs: build
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test-matrix || (inputs.test-arch == 'x64' && '{"arch":["x64"],"ts":["nts","ts"],"mode":["nocache","jit"]}') || (inputs.test-arch == 'x86' && '{"arch":["x86"],"ts":["nts","ts"],"mode":["nocache","jit"]}') || '{"arch":["x64","x86"],"ts":["nts","ts"],"mode":["nocache","jit"]}') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 240
    env:
      REUSE_SOURCE_REF: ${{ inputs.reuse-source-ref }}
      VALIDATION_TEST_FILES: ${{ inputs.test-files }}
    steps:
      - uses: actions/checkout@v6
      - shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}
          path: source
      - uses: actions/download-artifact@v8
        with:
          name: build-msvc-${{ matrix.arch }}-${{ matrix.ts }}
          path: input/msvc
          run-id: ${{ inputs.reuse-run || inputs.build-run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: build-clang-${{ matrix.arch }}-${{ matrix.ts }}
          path: input/clang
          run-id: ${{ inputs.build-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Run identical PHP test suites for both compilers
        shell: pwsh
        run: ./.github/scripts/clang-comparison/regressions.ps1 -Mode '${{ matrix.mode }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regressions-${{ matrix.arch }}-${{ matrix.ts }}-${{ matrix.mode }}
          path: regressions/
