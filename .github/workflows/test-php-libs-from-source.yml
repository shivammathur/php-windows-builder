name: Build PHP with custom library builds from winlibs/winlib-builder (source)
run-name: Build PHP from source ${{ inputs.php-src-ref }}
on:
  workflow_dispatch:
    inputs:
      php-src-repository:
        description: 'php-src repository to source builds and tests from'
        required: true
      php-src-ref:
        description: 'Branch, tag, or SHA in the php-src repository to source builds and tests from'
        required: true
      runner:
        description: 'Windows runner override (auto selects the source-compatible hosted image)'
        type: choice
        options: [auto, windows-2022, windows-2022-sf]
        default: auto
      libs-build-runs:
        description: 'Comma-separated list of GitHub Actions run IDs from winlibs/winlib-builder'
        required: false
      sbom:
        type: choice
        options: ['true', 'false']
        description: Add SBOM files to binary archives
        required: false
        default: 'true'

jobs:
  resolve-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
      source-sha: ${{ steps.resolve.outputs.source-sha }}
      version: ${{ steps.resolve.outputs.version }}
      legacy: ${{ steps.resolve.outputs.legacy }}
      arches: ${{ steps.resolve.outputs.arches }}
    steps:
      - name: Checkout PHP source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: php-src
          fetch-depth: 1
          sparse-checkout: main/php_version.h
          sparse-checkout-cone-mode: false

      - name: Resolve runner
        id: resolve
        shell: bash
        env:
          REQUESTED_RUNNER: ${{ inputs.runner }}
        run: |
          read -r major minor < <(awk '/^#define PHP_(MAJOR|MINOR)_VERSION/ { v[++i]=$3 } END { print v[1], v[2] }' php-src/main/php_version.h)
          runner="$([ "$major" -gt 8 ] || { [ "$major" -eq 8 ] && [ "$minor" -ge 6 ]; } && echo windows-2025-vs2026 || echo windows-2022)"
          if [[ "$REQUESTED_RUNNER" != auto && -n "$REQUESTED_RUNNER" ]]; then
            if [[ "$runner" == windows-2025-vs2026 ]]; then
              echo 'The Windows 2022 override cannot build PHP 8.6 or newer' >&2
              exit 1
            fi
            runner="$REQUESTED_RUNNER"
          fi
          version=$(awk '/^#define PHP_VERSION / {gsub(/"/, "", $3); print $3}' php-src/main/php_version.h)
          legacy=false
          if [[ "$major" -eq 5 || ( "$major" -eq 7 && "$minor" -le 1 ) ]]; then legacy=true; fi
          arches='["x64","x86"]'
          if [[ "$major" -eq 5 && "$minor" -le 4 ]]; then arches='["x86"]'; fi
          echo "PHP source version: $major.$minor; runner: $runner"
          {
            echo "version=$version"
            echo "legacy=$legacy"
            echo "arches=$arches"
            echo "runner=$runner"
            echo "source-sha=$(git -C php-src rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  php:
    needs: resolve-runner
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.resolve-runner.outputs.arches) }}
        ts: [nts, ts]
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    steps:
      - name: Configure PHP source line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout PHP source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ needs.resolve-runner.outputs.source-sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: builder

      - name: Prepare source and preserve provenance
        shell: pwsh
        env:
          SOURCE_REPOSITORY: ${{ inputs.php-src-repository }}
          SOURCE_REF: ${{ inputs.php-src-ref }}
        run: |
          python builder/php/BuildPhp/legacy/prepare-source.py . --repository $env:SOURCE_REPOSITORY --ref $env:SOURCE_REF
          if ($LASTEXITCODE -ne 0) { throw 'Source preparation failed' }

      - name: Build
        uses: ./builder/php
        with:
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          libs-build-runs: ${{ inputs.libs-build-runs }}
          sbom: ${{ needs.resolve-runner.outputs.legacy == 'true' && 'false' || inputs.sbom }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PHP_BUILD_PROVIDER: "The PHP Group"

  artifacts:
    runs-on: ubuntu-latest
    needs: php
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - name: Upload artifacts
        uses: actions/upload-artifact/merge@v7
        id: artifacts
        with:
          name: artifacts
          delete-merged: true
          pattern: artifacts-*

  tests:
    if: needs.resolve-runner.outputs.legacy != 'true'
    needs: [resolve-runner, artifacts]
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.resolve-runner.outputs.arches) }}
        ts: [nts, ts]
        opcache: [opcache, nocache]
        test-type: [php, ext]
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        id: artifacts
        with:
          name: artifacts

      - name: Get Cache Key
        id: cache-key
        shell: pwsh
        run: |
          $artifactDirectory = $(pwd).Path
          $zip = Get-ChildItem -Path $artifactDirectory -Filter "php-*.zip" -File |
            Where-Object { $_.Name -match "^php-(.+?)-(?:nts-)?Win32-v[sc]\d+-${{ matrix.arch }}\.zip$" } |
            Select-Object -First 1
          if ($null -eq $zip) {
            throw "Unable to determine PHP version from build artifacts in $artifactDirectory"
          }
          $phpVersion = [regex]::Match($zip.Name, '^php-(.+?)-(?:nts-)?Win32-v[sc]\d+-').Groups[1].Value

          Import-Module (Join-Path $(pwd).Path '\php\BuildPhp') -Force
          $cacheInfo = Get-DepsCacheInfo -PhpVersion $phpVersion -Arch '${{ matrix.arch }}' -LibsBuildRuns '${{ inputs.libs-build-runs }}' -IncludeDefaultRunsKey
          Set-Content -Path packages.txt -Value ($cacheInfo.Packages -join "`n")
          Add-Content -Value "php-version=$phpVersion" -Path $env:GITHUB_OUTPUT
          Add-Content -Value "cache-key=$($cacheInfo.CacheKey)" -Path $env:GITHUB_OUTPUT
          Add-Content -Value "cache-dir=$($cacheInfo.CacheDir)" -Path $env:GITHUB_OUTPUT

      - name: Cache Deps
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: ${{ steps.cache-key.outputs.cache-dir }}
          key: ${{ steps.cache-key.outputs.cache-key }}-${{ hashFiles('packages.txt') }}

      - name: Test PHP
        shell: pwsh
        continue-on-error: true
        env:
          DEPS_DIR: ${{ steps.cache-key.outputs.cache-dir }}
          DEPS_CACHE_HIT: ${{ steps.cache-deps.outputs.cache-hit }}
          LIBS_BUILD_RUNS: ${{ inputs.libs-build-runs }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Import-Module (Join-Path $(pwd).Path '\php\BuildPhp') -Force
          Invoke-PhpTests -PhpVersion ${{ steps.cache-key.outputs.php-version }} `
                          -Arch ${{matrix.arch}} `
                          -Ts ${{matrix.ts}} `
                          -Opcache ${{matrix.opcache}} `
                          -TestType ${{matrix.test-type}} `
                          -SourceRepository '${{ inputs.php-src-repository }}' `
                          -SourceRef '${{ needs.resolve-runner.outputs.source-sha }}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: test-results-${{matrix.arch}}-${{matrix.ts}}-${{matrix.opcache}}-${{matrix.test-type}}
          path: test-${{matrix.arch}}-${{matrix.ts}}-${{matrix.opcache}}-${{matrix.test-type}}.xml

  smoke-tests:
    if: needs.resolve-runner.outputs.legacy != 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.resolve-runner.outputs.arches) }}
        ts: [nts, ts]
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    needs: [resolve-runner, artifacts]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts
          path: artifacts

      - name: Smoke test PHP builds
        shell: pwsh
        run: |
          Import-Module (Join-Path $(pwd).Path '\php\BuildPhp') -Force
          Invoke-PhpSmokeTests -ArtifactsDirectory (Join-Path $(pwd).Path 'artifacts') `
                               -Arch ${{matrix.arch}} `
                               -Ts ${{matrix.ts}}

  legacy-package-tests:
    if: needs.resolve-runner.outputs.legacy == 'true'
    needs: [resolve-runner, artifacts]
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.resolve-runner.outputs.arches) }}
        ts: [nts, ts]
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: artifacts
          path: artifacts
      - uses: actions/checkout@v6
        with:
          repository: mlocati/powershell-phpmanager
          ref: 8ff33df31c7345ca77b0eaea4c4395e30f3ef64c
          path: phpmanager
          persist-credentials: false
      - name: Validate legacy packages on a clean runner
        shell: pwsh
        env:
          PHP_VERSION: ${{ needs.resolve-runner.outputs.version }}
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_TS: ${{ matrix.ts }}
          SOURCE_COMMIT: ${{ needs.resolve-runner.outputs.source-sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Get-Content artifacts/source-provenance.json -Raw | ConvertFrom-Json
          if ($proof.commit -cne $env:SOURCE_COMMIT -or $proof.version -cne $env:PHP_VERSION) { throw 'Source provenance mismatch' }
          $source = "artifacts/php-$env:PHP_VERSION-src.zip"
          if ((Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant() -cne $proof.source_archive_sha256) { throw 'Source archive mismatch' }
          . ./php/BuildPhp/legacy/install-test-xdebug.ps1
          $suite = if ($env:PHP_VERSION -match '^5\.[3-5]\.') { 'early-tests' } else { 'tests' }
          & "./php/BuildPhp/legacy/$suite/validate.ps1" -PhpVersion $env:PHP_VERSION -Arch $env:BUILD_ARCH -Ts $env:BUILD_TS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-validation-${{ matrix.arch }}-${{ matrix.ts }}
          path: evidence
          if-no-files-found: error
