name: Diagnose full PHP ARM64 PGO training
run-name: Compare full ARM64 PGO training settings
on:
  workflow_dispatch:
    inputs:
      php-src-repository:
        description: 'php-src repository to source builds and tests from'
        required: true
      php-src-ref:
        description: 'Branch, tag, or SHA in the php-src repository to source builds and tests from'
        required: true
      libs-build-runs:
        description: 'Comma-separated list of GitHub Actions run IDs from winlibs/winlib-builder'
        required: false
      sbom:
        type: choice
        options: ['true', 'false']
        description: Add SBOM files to binary archives
        required: false
        default: 'true'

jobs:
  resolve-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout PHP source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: php-src
          fetch-depth: 1
          sparse-checkout: main/php_version.h
          sparse-checkout-cone-mode: false

      - name: Resolve runner
        id: resolve
        shell: bash
        run: |
          read -r major minor < <(awk '/^#define PHP_(MAJOR|MINOR)_VERSION/ { v[++i]=$3 } END { print v[1], v[2] }' php-src/main/php_version.h)
          runner="$([ "$major" -gt 8 ] || { [ "$major" -eq 8 ] && [ "$minor" -ge 6 ]; } && echo windows-11-vs2026-arm || echo windows-11-arm)"
          echo "PHP source version: $major.$minor; runner: $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "version=$(awk '/^#define PHP_VERSION / { gsub(/"/, "", $3); print $3 }' php-src/main/php_version.h)" >> "$GITHUB_OUTPUT"

  deps:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    outputs:
      cache-dir: ${{ steps.cache-key.outputs.cache-dir }}
      cache-key: ${{ steps.restore.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/arm64-series-dependencies

      - name: Get dependency cache key
        id: cache-key
        shell: pwsh
        run: |
          Import-Module ./php/BuildPhp -Force
          $info = Get-DepsCacheInfo -PhpVersion '${{ needs.resolve-runner.outputs.version }}' -Arch arm64 -LibsBuildRuns '${{ inputs.libs-build-runs }}' -IncludeDefaultRunsKey
          Set-Content packages.txt ($info.Packages -join "`n")
          Add-Content $env:GITHUB_OUTPUT "cache-key=$($info.CacheKey)"
          Add-Content $env:GITHUB_OUTPUT "cache-dir=$($info.CacheDir)"
          Add-Content $env:GITHUB_OUTPUT "vs=$($info.VsVersion)"

      - name: Restore dependency cache
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache-key.outputs.cache-dir }}
          key: ${{ steps.cache-key.outputs.cache-key }}-${{ hashFiles('packages.txt') }}

      - name: Download dependencies
        if: steps.restore.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          LIBS_BUILD_RUNS: ${{ inputs.libs-build-runs }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rate = Invoke-RestMethod https://api.github.com/rate_limit -Headers @{Authorization="Bearer $env:GITHUB_TOKEN"}
          $required = 12 * @('${{ inputs.libs-build-runs }}' -split ',' | Where-Object { $_ }).Count
          if ($rate.resources.core.remaining -lt $required) {
            $reset = [DateTimeOffset]::FromUnixTimeSeconds($rate.resources.core.reset)
            $wait = [Math]::Max(1, [int][Math]::Ceiling(($reset - [DateTimeOffset]::UtcNow).TotalSeconds) + 5)
            Write-Host "Waiting $wait seconds for the GitHub API quota to reset before parallel dependency downloads."
            Start-Sleep -Seconds $wait
          }
          Import-Module ./php/BuildPhp -Force
          & (Get-Module BuildPhp) {
            Add-PhpDeps -PhpVersion '${{ needs.resolve-runner.outputs.version }}' -VsVersion '${{ steps.cache-key.outputs.vs }}' -Arch arm64 -Destination '${{ steps.cache-key.outputs.cache-dir }}'
          }

      - name: Save dependency cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.cache-key.outputs.cache-dir }}
          key: ${{ steps.restore.outputs.cache-primary-key }}

  php:
    needs: [resolve-runner, deps]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
        ts: [ts]
        mode: [exact, no-path, merge-unit]
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    steps:
      - name: Configure PHP source line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout PHP source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.php-src-repository }}
          ref: ${{ inputs.php-src-ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: builder
          ref: test/arm64-series-dependencies

      - name: Restore dependency cache
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: ${{ needs.deps.outputs.cache-dir }}
          key: ${{ needs.deps.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Select diagnostic profile settings
        shell: pwsh
        run: |
          if ('${{ matrix.mode }}' -ne 'merge-unit') {
            $path = 'win32/build/confutils.js'
            $code = [IO.File]::ReadAllText($path)
            if ([regex]::Matches($code, '/LTCG:PGINSTRUMENT').Count -ne 1) { throw 'Unexpected core instrumentation flags' }
            $flags = if ('${{ matrix.mode }}' -eq 'exact') { '/LTCG /GENPROFILE:EXACT' } else { '/LTCG /GENPROFILE:NOPATH' }
            [IO.File]::WriteAllText($path, $code.Replace('/LTCG:PGINSTRUMENT', $flags))
            & git diff -- win32/build/confutils.js
            if ($LASTEXITCODE) { throw 'Cannot record diagnostic source overlay' }
          }
          $file = 'builder/php/BuildPhp/private/Invoke-PhpSdkStarter.ps1'
          $code = Get-Content $file -Raw
          $probe = @'
                  Add-Content $env:GITHUB_ENV "PROBE_SDK_DIR=$BuildDirectory/php-sdk"
                  if ($env:PGO_PROFILE_MODE -eq 'merge-unit') {
                      $pgoFile = Join-Path $BuildDirectory 'php-sdk/lib/php/libsdk/SDK/Build/PGO/Tool/PGO.php'
                      $text = [IO.File]::ReadAllText($pgoFile)
                      if (-not $text.Contains('pgomgr /merge:1000')) { throw 'Expected PGO merge weight missing' }
                      [IO.File]::WriteAllText($pgoFile, $text.Replace('pgomgr /merge:1000', 'pgomgr /merge'))
                      Write-Host 'Diagnostic SDK PGO merge weight changed from 1000 to 1'
                  }
          '@
          if (-not $code.Contains('        $toolsetArgs =')) { throw 'Missing SDK initialization hook' }
          $code = $code.Replace('        $toolsetArgs =', "$probe`n        `$toolsetArgs =")
          Set-Content $file $code
          $action = 'builder/php/action.yml'
          $content = [IO.File]::ReadAllText($action)
          [IO.File]::WriteAllText($action, $content.Replace('name: artifacts-', 'name: artifacts-${{ matrix.mode }}-'))

      - name: Build
        uses: ./builder/php
        with:
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          libs-build-runs: ${{ inputs.libs-build-runs }}
          sbom: ${{ inputs.sbom }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PGO_PROFILE_MODE: ${{ matrix.mode }}
          PHP_BUILD_PROVIDER: "The PHP Group"
          DEPS_DIR: ${{ needs.deps.outputs.cache-dir }}
          DEPS_CACHE_HIT: ${{ steps.deps.outputs.cache-hit }}

      - name: Record profile data and build state
        if: always()
        shell: pwsh
        run: |
          $obj = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'obj'
          if (Test-Path $obj) {
            $pgd = Join-Path $obj 'Release_TS/php8ts.pgd'
            if (Test-Path $pgd) { Get-FileHash $pgd | Format-List }
            $files = @($obj, 'Makefile', 'Makefile.objects', 'config.nice.bat', 'config.ts.bat', 'main/config.w32.h' | Where-Object { Test-Path $_ })
            & 7z a -t7z -mx=1 build-state.7z @files
            if ($LASTEXITCODE) { throw 'Cannot archive the compiler state' }
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pgo-state-${{ matrix.mode }}
          path: build-state.7z
