name: ARM64 PHP SDK launcher probe
on: workflow_dispatch
jobs:
  sdk:
    name: SDK ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            runner: windows-11-arm
          - php: '8.4'
            runner: windows-11-arm
          - php: '8.6'
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/arm64-series-dependencies
          path: builder
      - name: Build and run PGO program through the PHP SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./builder/php/BuildPhp -Force
          $vs = Get-VsVersion -PhpVersion '${{ matrix.php }}' -Arch arm64
          Get-PhpSdk -Arch arm64
          @'
          #include <windows.h>
          #include <stdio.h>
          int main(void) {
              volatile int value = 0;
              for (int i = 0; i < 100; i++) value += i;
              printf("PHP SDK ARM64 PGO runtime works: %d\n", value);
              return value != 4950;
          }
          '@ | Set-Content sdk-probe.c
          @'
          @echo off
          where cl.exe
          where pgort140.dll
          echo SDK: %WindowsSDKVersion%
          echo Toolset: %VCToolsVersion%
          cl.exe /nologo /O2 /GL sdk-probe.c /link /LTCG /GENPROFILE /OUT:sdk-probe.exe
          if errorlevel 1 exit /b 1
          sdk-probe.exe
          exit /b %errorlevel%
          '@ | Set-Content sdk-probe.bat
          Invoke-PhpSdkStarter -BuildDirectory (Get-Location).Path -VsConfig $vs -Arch arm64 -Task sdk-probe.bat
